# Releases whatever <Version> Directory.Build.props says, the first time main has it (the same pattern as
# hcti-dotnet-client). Every push to main:
#   1. runs the full CI (ci.yml) as the gate;
#   2. if tag v{Version} doesn't exist yet, creates it on the pushed commit;
#   3. only then publishes that commit's .nupkg to nuget.org and creates a GitHub release.
# Pushing a version that's already tagged just runs CI. So releasing = bumping <Version> in a PR and merging it.
#
# Unlike hcti-dotnet-client, the tag is only created once CI has passed: tagging first would leave a failed build's
# version tagged but unpublished, and a re-run would then skip it because the tag already exists.
#
# The publish happens in this same run because a tag pushed with GITHUB_TOKEN doesn't trigger workflows. Pushing a
# v* tag by hand also publishes, as long as it matches <Version>.
name: Release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

# Releases queue up rather than cancel each other.
concurrency:
  group: release
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    # ci.yml's regenerate-examples job declares contents: write. It never runs from here (it's PR/manual only), but
    # a called workflow can't be granted more than its caller passes on, and that's checked before anything runs.
    permissions:
      contents: write

  version:
    name: Read version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
      tag: ${{ steps.read.outputs.tag }}
    steps:
      - uses: actions/checkout@v7

      - name: Read <Version> from Directory.Build.props
        id: read
        run: |
          version=$(grep -oPm1 '(?<=<Version>)[^<]+' Directory.Build.props)
          if [ -z "$version" ]; then
            echo "::error::No <Version> found in Directory.Build.props."
            exit 1
          fi
          # A hand-pushed tag must agree with the version actually being packed.
          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match <Version>$version</Version> in Directory.Build.props."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "Version: $version"

  tag:
    name: Tag new version
    needs: [ci, version]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      created: ${{ steps.tag.outputs.created }}
    steps:
      - uses: actions/checkout@v7

      - name: Create the tag if this version is new
        id: tag
        env:
          TAG: ${{ needs.version.outputs.tag }}
        # `ls-remote --exit-code` exits 2 when the tag doesn't exist; anything else nonzero means the lookup itself
        # failed, which mustn't be mistaken for "new version".
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" > /dev/null; then
            echo "$TAG already exists: nothing new to release."
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          else
            code=$?
          fi
          if [ "$code" -ne 2 ]; then
            echo "::error::Couldn't check whether $TAG exists (git ls-remote exited $code)."
            exit "$code"
          fi
          git tag "$TAG" "$GITHUB_SHA"
          git push origin "$TAG"
          echo "Created $TAG on $GITHUB_SHA."
          echo "created=true" >> "$GITHUB_OUTPUT"

  publish:
    name: Publish to NuGet
    needs: [ci, version, tag]
    # always(): on a tag push the tag job is skipped, which would otherwise skip this too.
    if: >-
      always() &&
      needs.ci.result == 'success' &&
      needs.version.result == 'success' &&
      (needs.tag.outputs.created == 'true' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    # A GitHub environment, so publishing can be gated further (required reviewers, branch rules) in the repo settings.
    environment: nuget
    permissions:
      contents: write # the GitHub release
      id-token: write # NuGet trusted publishing
    steps:
      # The exact package CI built, tested and smoke-tested.
      - uses: actions/download-artifact@v8
        with:
          name: nupkg

      # Trusted publishing: exchanges this workflow's OIDC token for a short-lived API key. Needs a trusted
      # publishing policy for this repository and release.yml on nuget.org, and the nuget.org user name in the
      # NUGET_USER secret.
      - name: NuGet login
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to NuGet
        run: |
          for package in ./*.nupkg; do
            dotnet nuget push "$package" --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
          done

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          files: ./*.nupkg
          fail_on_unmatched_files: true
          generate_release_notes: true
